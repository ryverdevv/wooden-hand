<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/footer.css">
    <title></title>
</head>
    <body>
        <div class="logincontainer">
            <div class="logo">
            <img src="../assets/LOGO/logo2.png" alt="" width="500px">
        </div>

        <!--Login-->
        <div class="container">
            <div class="title">
                <h1 class="wood">WOODEN</h1>
                <h1 class="hand">HAND</h1>
            </div>
            <div class="login">
            <div class="arrow-left">
                <img src="../assets/arrowleft.png" alt="arrowleft" width="50px">
                <h2>Login</h2>
            </div>
            <div class="userpass">
                <div class="username">
                <input id="userName" type="text" placeholder="adminaccount">
            </div>
            <div class="password">
                <input id="passWord" type="password" placeholder="admin123">
            </div>
            <div class="loginbtn">
                 <button id="loginBtn">LOGIN</button>
            </div>
            <div class="forgotpassword"> 
                <p>Forgot Password?</p>
            </div>
            <div class="or">
                <span></span>
                <p>OR</p>
                <span></span>
            </div>
            <div class="google">
                <img src="../assets/google.png" alt=""><span>Continue  with Google</span>
            </div>
            <div class="terms">
                <h4>By Logging in, you agree to Wooden  Hand <span>Terms of Service</span></h4>
                <p> & Privacy Policy</p>
            </div>
            <div class="signupbtn">
                <p>New User?</p>
                <h4 id="SignupLink">Signup</h4>
            </div>
            </div>
        </div>
        </div>
        
        </div>

        <div id="footer-container"></div>
        
        <script src="../js/footer.js"></script>
        <script src="../function/login.js"></script>
    </body>
</html>
