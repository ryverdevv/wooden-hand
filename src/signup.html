<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/signup.css">
    <title></title>
</head>
    <body>
        <div class="logincontainer">
            <div class="logo">
            <img src="/assets/LOGO/logo2.png" alt="" width="500px">
        </div>

        <!--Login-->
        <div class="container">
            <div class="title">
                <h1 class="wood">WOODEN</h1>
                <h1 class="hand">HAND</h1>
            </div>
            <div class="login">
            <div class="arrow-left">
                <img src="/assets/arrowleft.png" alt="arrowleft" width="50px">
                <h2>CREATE ACCOUNT</h2>
            </div>
            <div class="para"> 
                <p class="para3">Fill your phone number or register with</p>
                <p class="para2"> your google account</p>
            </div>
            <div class="userpass">
            <div class="password">
                <input type="number" placeholder="Phone Number" min="11" max="11" required>
            </div>
            <div class="loginbtn">
                <button type="submit">NEXT</button>
            </div>
            <div class="or">
                <span></span>
                <p>OR</p>
                <span></span>
            </div>
            <div class="google">
                <img src="/assets/google.png" alt=""><span>Continue  with Google</span>
            </div>
            <div class="terms">
                <h4>By Signing up, you agree to Wooden  Hand <span>Terms of Service</span></h4>
                <p> & Privacy Policy</p>
            </div>
            <div class="signupbtn">
                <p>Already have account?</p>
                <h4>Login</h4>
            </div>
            </div>
        </div>
        </div>
        
        </div>    
    </body>
</html>
