<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

<div class="sidebar">

    <!-- Close Sidebar Button -->
    <button id="closeSidebarBtn" onclick="toggleSidebar()">
        ✕
    </button>

    <!-- Logo -->
    <div class="logo">
        <img src="../assets/LOGO/logo.png" alt="" width="100">
        <h2>Wooden Hand</h2>
    </div>

    <!-- Sidebar Links -->
    <div class="sidebar-links">

        <div class="sidebar-button">
            <button id="Dashboard">
                Dashboard
            </button>
        </div>

        <div class="sidebar-button">
            <button id="Products">
                Products
            </button>
        </div>

        <div class="sidebar-button">
            <button id="Orders">
                Orders
            </button>
        </div>

        <div class="sidebar-button">
            <button id="Users">
                Users
            </button>
        </div>

        <div class="sidebar-button">
            <button id="Custom">
                Custom Orders
            </button>
        </div>

        <div class="sidebar-button">
            <button id="Reviews">
                Reviews
            </button>
        </div>

        <div class="sidebar-button">
            <button id="Reports">
                Reports
            </button>
        </div>

        <div class="sidebar-button">
            <button id="Settings">
                Settings
            </button>
        </div>

        <!-- Logout -->
        <div class="logoutContainer">
            <button id="logoutButton">
                <img
                    src="../assets/admin-icons/Logout.png"
                    alt=""
                    width="50"
                >
                Logout
            </button>
        </div>

    </div>

</div>


</body>
</html>
